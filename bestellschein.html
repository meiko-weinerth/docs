<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestellschein - extraprima</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Fira Sans", sans-serif;
            background: #fff;
            color: #333;
            line-height: 1.5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e1dfdb;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .customer-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e1dfdb;
        }

        .customer-info label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #666;
        }

        .customer-info input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e1dfdb;
            font-family: "Fira Sans", sans-serif;
            font-size: 14px;
        }

        .customer-info input:focus {
            outline: none;
            border-color: #333;
        }

        .category-header {
            background: #f8f8f7;
            padding: 12px 15px;
            font-weight: 600;
            font-size: 16px;
            border: 1px solid #e1dfdb;
            border-bottom: none;
            margin-top: 20px;
        }

        .category-header:first-of-type {
            margin-top: 0;
        }

        /* Desktop Tabelle */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-bottom: 0;
        }

        thead {
            background: #f8f8f7;
        }

        th {
            padding: 12px 10px;
            text-align: left;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid #e1dfdb;
            white-space: nowrap;
        }

        th.right, td.right {
            text-align: right;
        }

        th.center, td.center {
            text-align: center;
        }

        td {
            padding: 10px;
            border: 1px solid #e1dfdb;
            vertical-align: middle;
        }

        tr:hover {
            background: #fafafa;
        }

        .product-name {
            font-weight: 500;
        }

        .rating {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        .price-original {
            text-decoration: line-through;
            color: #999;
            font-size: 11px;
        }

        .price-offer {
            font-weight: 600;
            color: #333;
        }

        .price-per-liter {
            font-size: 11px;
            color: #666;
        }

        .discount {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 500;
        }

        .stock {
            font-size: 12px;
        }

        .stock.low {
            color: #c62828;
        }

        input[type="number"] {
            width: 70px;
            padding: 8px;
            border: 1px solid #e1dfdb;
            text-align: center;
            font-family: "Fira Sans", sans-serif;
            font-size: 14px;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #333;
        }

        input[type="number"]::-webkit-inner-spin-button {
            opacity: 1;
        }

        .line-total {
            font-weight: 600;
            min-width: 80px;
        }

        .summary {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #e1dfdb;
            background: #f8f8f7;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e1dfdb;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 20px;
            font-weight: 700;
            padding-top: 15px;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-family: "Fira Sans", sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            background: #fff;
            border: 1px solid #333;
            transition: all 0.2s;
        }

        button:hover {
            background: #333;
            color: #fff;
        }

        button.primary {
            background: #333;
            color: #fff;
        }

        button.primary:hover {
            background: #555;
        }

        /* Mobile Card Layout */
        .mobile-cards {
            display: none;
        }

        .product-card {
            border: 1px solid #e1dfdb;
            margin-bottom: -1px;
            display: grid;
            grid-template-columns: 1fr auto;
            grid-template-rows: auto auto;
            gap: 0;
        }

        .product-card:hover {
            background: #fafafa;
        }

        .card-main {
            padding: 12px;
            grid-column: 1;
            grid-row: 1 / 3;
            border-right: 1px solid #e1dfdb;
        }

        .card-row1 {
            margin-bottom: 8px;
        }

        .card-nr {
            font-weight: 600;
            color: #666;
            font-size: 12px;
        }

        .card-product {
            font-weight: 500;
            font-size: 14px;
            margin-top: 2px;
        }

        .card-rating {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }

        .card-row2 {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            font-size: 12px;
            color: #666;
            padding-top: 8px;
            border-top: 1px solid #e1dfdb;
        }

        .card-row2 .label {
            font-size: 10px;
            text-transform: uppercase;
            color: #999;
            display: block;
        }

        .card-row2 .value {
            font-weight: 500;
            color: #333;
        }

        .card-row2 .price-original {
            text-decoration: line-through;
            color: #999;
            font-size: 11px;
        }

        .card-order {
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 100px;
            grid-column: 2;
            grid-row: 1 / 3;
        }

        .card-order input[type="number"] {
            width: 60px;
            padding: 10px 5px;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .card-order .line-total {
            font-size: 14px;
            text-align: center;
        }

        /* Print Styles */
        @media print {
            .actions, .no-print {
                display: none !important;
            }

            body {
                padding: 0;
                font-size: 11px;
            }

            .container {
                max-width: 100%;
            }

            table {
                font-size: 10px;
            }

            th, td {
                padding: 6px 8px;
            }

            input[type="number"] {
                border: none;
                background: transparent;
                width: 50px;
                padding: 0;
            }

            .customer-info {
                padding: 10px;
            }

            .customer-info input {
                border: none;
                border-bottom: 1px solid #e1dfdb;
                padding: 5px 0;
            }

            h1 {
                font-size: 22px;
            }

            .category-header {
                page-break-before: auto;
                break-before: auto;
            }

            tr {
                page-break-inside: avoid;
                break-inside: avoid;
            }

            .summary {
                page-break-inside: avoid;
                break-inside: avoid;
            }

            .mobile-cards {
                display: none !important;
            }

            .desktop-table {
                display: block !important;
            }
        }

        /* Mobile Styles */
        @media (max-width: 900px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 22px;
            }

            .customer-info {
                padding: 15px;
                gap: 10px;
            }

            .desktop-table {
                display: none;
            }

            .mobile-cards {
                display: block;
            }

            .category-header {
                padding: 10px 12px;
                font-size: 14px;
            }

            .summary {
                padding: 15px;
            }

            .summary-row.total {
                font-size: 18px;
            }

            .actions {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

    <div class="container">
        <header>
            <h1>Bestellschein</h1>
            <p class="subtitle">Bitte tragen Sie Ihre gewunschte Bestellmenge ein</p>
        </header>

        <div class="customer-info">
            <div>
                <label for="customerName">Name / Firma</label>
                <input type="text" id="customerName" placeholder="Ihr Name oder Firmenname">
            </div>
            <div>
                <label for="customerEmail">E-Mail</label>
                <input type="email" id="customerEmail" placeholder="ihre@email.de">
            </div>
            <div>
                <label for="customerPhone">Telefon</label>
                <input type="tel" id="customerPhone" placeholder="Ihre Telefonnummer">
            </div>
            <div>
                <label for="customerNote">Anmerkungen</label>
                <input type="text" id="customerNote" placeholder="Optionale Anmerkungen">
            </div>
        </div>

        <div id="orderTable"></div>

        <div class="summary">
            <div class="summary-row">
                <span>Anzahl Positionen:</span>
                <span id="totalPositions">0</span>
            </div>
            <div class="summary-row">
                <span>Anzahl Flaschen:</span>
                <span id="totalBottles">0</span>
            </div>
            <div class="summary-row total">
                <span>Gesamtsumme (Brutto):</span>
                <span id="totalSum">0,00 EUR</span>
            </div>
        </div>

        <div class="actions">
            <button onclick="printOrder()">Drucken</button>
            <button onclick="sendEmail()">Per E-Mail senden</button>
            <button class="primary" onclick="downloadPDF()">Als PDF herunterladen</button>
        </div>
    </div>

        // Tabelle rendern (Desktop + Mobile)
        function renderTable() {
            const container = document.getElementById('orderTable');
            let desktopHtml = '<div class="desktop-table">';
            let mobileHtml = '<div class="mobile-cards">';
            let currentCategory = '';

            products.forEach((product, index) => {
                // Kategorie-Header
                if (product.category !== currentCategory) {
                    if (currentCategory !== '') {
                        desktopHtml += '</tbody></table>';
                    }
                    currentCategory = product.category;

                    // Desktop Header
                    desktopHtml += `
                        <div class="category-header">${currentCategory}</div>
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 45px;">Nr.</th>
                                    <th>Produkt</th>
                                    <th style="width: 60px;" class="center">Bestand</th>
                                    <th style="width: 75px;" class="right">Listenpr.</th>
                                    <th style="width: 75px;" class="right">Angebot</th>
                                    <th style="width: 70px;" class="right">EUR/Ltr.</th>
                                    <th style="width: 55px;" class="center">Rabatt</th>
                                    <th style="width: 70px;" class="center">Menge</th>
                                    <th style="width: 85px;" class="right">Summe</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    // Mobile Header
                    mobileHtml += `<div class="category-header">${currentCategory}</div>`;
                }

                const stockClass = product.stock <= 10 ? 'low' : '';

                // Desktop Row
                desktopHtml += `
                    <tr>
                        <td>${product.nr}</td>
                        <td>
                            <div class="product-name">${product.name}</div>
                            <div class="rating">${product.rating}</div>
                        </td>
                        <td class="center stock ${stockClass}">${product.stock}</td>
                        <td class="right">
                            <span class="price-original">${formatCurrency(product.listPrice)}</span>
                        </td>
                        <td class="right">
                            <span class="price-offer">${formatCurrency(product.offerPrice)}</span>
                        </td>
                        <td class="right">
                            <span class="price-per-liter">${formatCurrency(product.pricePerLiter)}</span>
                        </td>
                        <td class="center">
                            <span class="discount">${product.discount}</span>
                        </td>
                        <td class="center">
                            <input type="number"
                                   min="0"
                                   max="${product.stock}"
                                   value=""
                                   data-index="${index}"
                                   data-price="${product.offerPrice}"
                                   oninput="calculateLine(this)"
                                   placeholder="0">
                        </td>
                        <td class="right line-total" id="total-${index}">-</td>
                    </tr>
                `;

                // Mobile Card
                mobileHtml += `
                    <div class="product-card">
                        <div class="card-main">
                            <div class="card-row1">
                                <div class="card-nr">${product.nr}</div>
                                <div class="card-product">${product.name}</div>
                                <div class="card-rating">${product.rating}</div>
                            </div>
                            <div class="card-row2">
                                <div>
                                    <span class="label">Bestand</span>
                                    <span class="value ${stockClass}">${product.stock}</span>
                                </div>
                                <div>
                                    <span class="label">Listenpreis</span>
                                    <span class="price-original">${formatCurrency(product.listPrice)}</span>
                                </div>
                                <div>
                                    <span class="label">Angebot</span>
                                    <span class="value">${formatCurrency(product.offerPrice)}</span>
                                </div>
                                <div>
                                    <span class="label">EUR/Ltr.</span>
                                    <span class="value">${formatCurrency(product.pricePerLiter)}</span>
                                </div>
                                <div>
                                    <span class="label">Rabatt</span>
                                    <span class="discount">${product.discount}</span>
                                </div>
                            </div>
                        </div>
                        <div class="card-order">
                            <input type="number"
                                   min="0"
                                   max="${product.stock}"
                                   value=""
                                   data-index="${index}"
                                   data-price="${product.offerPrice}"
                                   oninput="calculateLine(this)"
                                   placeholder="0">
                            <div class="line-total" id="total-mobile-${index}">-</div>
                        </div>
                    </div>
                `;
            });

            desktopHtml += '</tbody></table></div>';
            mobileHtml += '</div>';

            container.innerHTML = desktopHtml + mobileHtml;
        }

        // Zeilensumme berechnen
        function calculateLine(input) {
            const index = input.dataset.index;
            const price = parseFloat(input.dataset.price);
            const quantity = parseInt(input.value) || 0;
            const total = quantity * price;

            // Update Desktop
            const totalCell = document.getElementById(`total-${index}`);
            if (totalCell) {
                totalCell.textContent = quantity > 0 ? formatCurrency(total) : '-';
            }

            // Update Mobile
            const totalMobileCell = document.getElementById(`total-mobile-${index}`);
            if (totalMobileCell) {
                totalMobileCell.textContent = quantity > 0 ? formatCurrency(total) : '-';
            }

            // Sync inputs between desktop and mobile
            const allInputs = document.querySelectorAll(`input[data-index="${index}"]`);
            allInputs.forEach(inp => {
                if (inp !== input) {
                    inp.value = input.value;
                }
            });

            calculateTotal();
        }

        // Gesamtsumme berechnen
        function calculateTotal() {
            let totalSum = 0;
            let totalBottles = 0;
            let totalPositions = 0;

            // Nur Desktop-Inputs zahlen (Mobile ist synchronisiert)
            const inputs = document.querySelectorAll('.desktop-table input[type="number"][data-price]');
            inputs.forEach(input => {
                const quantity = parseInt(input.value) || 0;
                const price = parseFloat(input.dataset.price);
                if (quantity > 0) {
                    totalSum += quantity * price;
                    totalBottles += quantity;
                    totalPositions++;
                }
            });

            document.getElementById('totalSum').textContent = formatCurrency(totalSum);
            document.getElementById('totalBottles').textContent = totalBottles;
            document.getElementById('totalPositions').textContent = totalPositions;
        }

        // Wahrung formatieren
        function formatCurrency(value) {
            return value.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' EUR';
        }

        // Bestellung als Text generieren
        function generateOrderText() {
            const customerName = document.getElementById('customerName').value || '-';
            const customerEmail = document.getElementById('customerEmail').value || '-';
            const customerPhone = document.getElementById('customerPhone').value || '-';
            const customerNote = document.getElementById('customerNote').value || '-';

            let orderLines = [];
            const inputs = document.querySelectorAll('.desktop-table input[type="number"][data-price]');

            inputs.forEach(input => {
                const quantity = parseInt(input.value) || 0;
                if (quantity > 0) {
                    const index = input.dataset.index;
                    const product = products[index];
                    const total = quantity * product.offerPrice;
                    orderLines.push(`${product.nr} | ${product.name} | ${quantity} x ${formatCurrency(product.offerPrice)} = ${formatCurrency(total)}`);
                }
            });

            const totalSum = document.getElementById('totalSum').textContent;
            const totalBottles = document.getElementById('totalBottles').textContent;

            let text = `BESTELLUNG\n`;
            text += `==========================================\n\n`;
            text += `Kunde: ${customerName}\n`;
            text += `E-Mail: ${customerEmail}\n`;
            text += `Telefon: ${customerPhone}\n`;
            text += `Anmerkungen: ${customerNote}\n\n`;
            text += `==========================================\n`;
            text += `BESTELLTE ARTIKEL:\n`;
            text += `==========================================\n\n`;
            text += orderLines.join('\n');
            text += `\n\n==========================================\n`;
            text += `Anzahl Flaschen: ${totalBottles}\n`;
            text += `GESAMTSUMME: ${totalSum}\n`;
            text += `==========================================\n`;

            return text;
        }

        // Drucken
        function printOrder() {
            window.print();
        }

        // E-Mail senden
        function sendEmail() {
            const orderText = generateOrderText();
            const subject = encodeURIComponent('Weinbestellung');
            const body = encodeURIComponent(orderText);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        // PDF herunterladen
        function downloadPDF() {
            const container = document.querySelector('.container');
            const actions = document.querySelector('.actions');
            const mobileCards = document.querySelector('.mobile-cards');
            const desktopTable = document.querySelector('.desktop-table');

            // Fur PDF: Mobile ausblenden, Desktop anzeigen
            actions.style.display = 'none';
            if (mobileCards) mobileCards.style.display = 'none';
            if (desktopTable) desktopTable.style.display = 'block';

            const opt = {
                margin: [8, 8, 8, 8],
                filename: 'Bestellschein.pdf',
                image: { type: 'jpeg', quality: 0.95 },
                html2canvas: {
                    scale: 1.2,
                    useCORS: true,
                    logging: false
                },
                jsPDF: {
                    unit: 'mm',
                    format: 'a4',
                    orientation: 'portrait'
                },
                pagebreak: {
                    mode: ['css', 'legacy'],
                    avoid: ['tr', '.summary', '.category-header']
                }
            };

            html2pdf().set(opt).from(container).save().then(() => {
                actions.style.display = 'flex';
                if (mobileCards) mobileCards.style.display = '';
                if (desktopTable) desktopTable.style.display = '';
            }).catch(err => {
                console.error('PDF Error:', err);
                actions.style.display = 'flex';
                if (mobileCards) mobileCards.style.display = '';
                if (desktopTable) desktopTable.style.display = '';
                alert('PDF-Erstellung fehlgeschlagen. Bitte nutzen Sie die Drucken-Funktion und wahlen Sie "Als PDF speichern".');
            });
        }

        // Initialisieren
        renderTable();
    </script>
</body>
</html>
